name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # Docker는 ubuntu-latest에 기본 설치·실행 상태라 Testcontainers(PostgreSQL)가
      # 별도 설정 없이 동작한다. 시크릿도 필요 없다 - application-test.yml이 고정 플레이스홀더를 쓴다.
      - run: ./gradlew test
