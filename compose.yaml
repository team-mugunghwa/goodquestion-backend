services:
  postgres:
    image: postgres:16-alpine
    container_name: goodquestion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: goodquestion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - goodquestion-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goodquestion"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: goodquestion-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  goodquestion-postgres-data:
