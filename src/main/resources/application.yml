server:
  # Railway 같은 PaaS는 PORT 환경변수로 리스닝 포트를 지정한다. 로컬은 8080.
  port: ${PORT:8080}
  # push마다 재배포되는 구조라, 처리 중이던 요청을 끊지 않고 끝낼 시간을 준다.
  # 그 시간이 지나도 안 끝나면 강제 종료한다.
  shutdown: graceful

spring:
  application:
    name: goodquestion-backend

  servlet:
    multipart:
      # 30초 16kHz mono WAV가 약 960KB라 Boot 기본 1MB에 아슬아슬하게 걸린다(팀 확정
      # 대기였으나 STT 실측을 위해 10MB로 올린다). 요청 전체 한도도 같이 올린다.
      max-file-size: 10MB
      max-request-size: 12MB

  # 비밀번호 재설정 메일 발송(계정-06). 기본값 없이 필수로 둔다 — 값이 비면 배포 시점에
  # 조용히 안 되는 대신 기동부터 막는 쪽이 안전하다.
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: ${SMTP_AUTH}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS}

  lifecycle:
    timeout-per-shutdown-phase: 20s

  threads:
    virtual:
      # 요청 시간의 대부분이 STT/LLM/TTS 대기다. 가상 스레드면 대기 중에도 플랫폼 스레드를
      # 쥐고 있지 않아 같은 서버로 더 많은 동시 요청을 받는다. JDK 25라 synchronized 고정 문제도 없다.
      enabled: true

  datasource:
    url: ${DB_URL}          # JDBC URL. Railway에서는 Postgres 서비스 참조로 조립한다.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # 커넥션 풀은 앱 전체가 공유한다. 대화 처리가 풀을 오래 쥐면 로그인까지 함께 막히므로
    # 값보다 점유 시간이 중요하다. 지금은 턴 하나에서 가장 긴 트랜잭션이 55ms다.
    # 배경과 측정값은 docs/트러블슈팅_턴_처리_커넥션_점유.md에 있다.
    hikari:
      # 기본값과 같은 10이지만 명시해 둔다. 조용히 적용되는 값은 튜닝 대상으로 보이지 않는다.
      # 인스턴스를 여러 개 띄우면 이 값 곱하기 인스턴스 수가 DB의 연결 상한을 넘지 않아야 한다.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # 풀이 비었을 때 기다리는 시간. 기본값 30초는 장애를 30초 동안 느린 응답으로 감춘다.
      # 55ms짜리 트랜잭션이라면 3초를 기다려도 못 얻는 상황은 대기가 아니라 장애다.
      connection-timeout: 3000
      # 이 시간을 넘겨 커넥션을 쥐고 있으면 경고와 스택트레이스를 남긴다(끊지는 않는다).
      # 외부 호출이 트랜잭션 안으로 다시 들어오는 회귀를 잡으려고 둔다.
      #
      # Hikari가 허용하는 최솟값이 2초라 그 값을 쓴다. 정상 점유는 턴 처리 55ms,
      # 기동 시 Flyway 90ms라 스무 배 넘는 여유가 있다. 고쳤던 상태가 4076ms였으니
      # 5초로 두면 같은 회귀를 놓친다 - 여유를 크게 잡을수록 안전한 설정이 아니다.
      leak-detection-threshold: 2000
  # 스키마는 Flyway가 관리한다. 앱 기동 시 db/migration의 V*.sql을 순서대로 적용하고
  # 적용 이력을 flyway_schema_history에 남긴다 - 같은 마이그레이션이 두 번 돌지 않는다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 이미 테이블이 있는데 이력 테이블이 없는 DB는 기동을 거부한다(기본값 false).
    # 반쯤 적용된 스키마를 만드는 대신 명시적으로 실패시키는 쪽이 안전하다.
    # 기존 DB에 도입할 때만 true로 켜고, 그 DB가 V1과 정확히 같은 상태인지 먼저 확인한다.
    baseline-on-migrate: false

  jpa:
    hibernate:
      # Flyway가 만든 스키마와 엔티티가 일치하는지만 검증한다(생성/변경하지 않음).
      # Boot는 Flyway를 EntityManagerFactory보다 먼저 실행하므로 순서가 보장된다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 100

# 브라우저의 preflight(OPTIONS)를 통과시킬 오리진 목록. 콤마로 구분한다.
#
# Vercel 프리뷰 배포는 커밋마다 주소가 바뀌므로 패턴으로 적는다.
# 팀 슬러그(team-mugunghwa)까지 넣는 이유: goodquestion-frontend-* 까지만 적으면
# 같은 이름으로 프로젝트를 만든 남의 Vercel 계정 주소도 걸린다.
#
# 슬러그나 도메인이 바뀌면 코드를 고치지 말고 Railway 환경변수만 바꾼다.
# 운영에서 로컬 오리진을 빼고 싶을 때도 마찬가지다.
cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://goodquestion-frontend.vercel.app,https://goodquestion-frontend-*-team-mugunghwa.vercel.app}

jwt:
  secret: ${JWT_SECRET}                      # 자체 발급 Access 토큰 서명 키 (HS256, 32바이트 이상 권장)
  expiration-ms: ${JWT_EXPIRATION_MS:1800000} # Access는 짧게 두고 만료 시 리프레시로 재발급한다. 탈취돼도 노출 창이 30분으로 줄어든다.
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}   # 14일

kakao:
  client-id: ${KAKAO_CLIENT_ID:}          # 카카오 REST API 키 - 인가 코드 교환에 필요
  client-secret: ${KAKAO_CLIENT_SECRET:}  # 카카오 콘솔에서 사용함으로 설정한 경우에만

google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

external:
  # 외부 API 호출 상한. 벤더가 응답하지 않을 때 호출 스레드와 DB 커넥션이 함께 묶이는 것을 막는다.
  # 응답 타임아웃은 LLM 두 번을 순차로 부르는 것을 감안해 정한다 - 이 값의 두 배가 턴 하나의
  # 최악 소요 시간이 되고, 그보다 바깥쪽(프록시, 클라이언트) 타임아웃이 더 길어야 한다.
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:3000}
    response-timeout-ms: ${HTTP_RESPONSE_TIMEOUT_MS:10000}
  # STT/TTS는 벤더 비교 중 OpenAI 실측 구성이다(미결-01). 키를 따로 주지 않으면 LLM 키를
  # 같이 쓴다 - 벤더가 갈리면 각자 키를 지정한다.
  stt:
    api-key: ${STT_API_KEY:${LLM_API_KEY}}
    model: ${STT_MODEL:gpt-4o-mini-transcribe}
    # 저신뢰 기준값(2026-08 확정). 신뢰도 = exp(토큰 logprob 평균), 미만이면 낮음.
    # 아동 음성은 신뢰도 분포가 낮게 깔려 성인 기준(Whisper 실패 컷 환산 0.37)과
    # 품질 의심 수준(0.6) 사이로 완화했다. 아동 실녹음 검증(미결-01) 후 조정한다.
    low-confidence-threshold: ${STT_LOW_CONFIDENCE_THRESHOLD:0.5}
    # 오인식이 잦은 이야기 어휘(시드 proper_nouns의 합집합). 실측에서 "방귀"가 "방비"로
    # 인식됐다. 장면별 힌트가 정석이지만 /api/stt 계약에 장면 정보가 없어 전체를 준다.
    vocabulary-hint: "며느리, 시아버지, 방귀, 친정, 갓, 이장, 배나무, 장대, 기왓장"
  tts:
    api-key: ${TTS_API_KEY:${LLM_API_KEY}}
    model: ${TTS_MODEL:gpt-4o-mini-tts}
    default-voice: nova
    # 캐릭터명은 story_scenes.character_name과 일치해야 한다. 캐릭터 메타(tts_voice)는
    # story 도메인에 있는데 ai는 도메인을 참조할 수 없어 벤더 확정 전까지 설정으로 잇는다.
    # 맵 키에 공백·한글이 있어 대괄호 표기를 쓴다. 벗기면 프로퍼티 이름 규칙(소문자,
    # 숫자, 하이픈)에 걸려 바인딩이 통째로 실패하고 앱이 뜨지 않는다.
    voices:
      "[방귀쟁이 며느리]": nova
      "[시아버지]": onyx
      "[마을 이장]": echo
    instructions:
      "[방귀쟁이 며느리]": "조심스럽고 부끄러움이 많지만 따뜻한 젊은 여성. 미안해하면서도 다정하게 말한다."
      "[시아버지]": "체면을 중시하고 호들갑스러운 할아버지. 과장되게 놀라지만 무섭지 않고 익살스럽다."
      "[마을 이장]": "친근하고 반응이 큰 어른. 호기심 많고 시원시원하게 말한다."
  llm:
    api-key: ${LLM_API_KEY}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    # 분석·캐릭터·리포트·단어 전부 같은 모델을 쓴다. 용도별로 갈라야 할 근거가 생기면 나눈다.
    model: ${LLM_MODEL:gpt-5-mini}
    # gpt-5 계열 추론 강도. 발화 한 건에 LLM을 두 번 부르는 구조라 지연이 품질보다 비싸다.
    # 판정 품질이 부족하면 low, medium 순으로 올려서 재본다.
    reasoning-effort: ${LLM_REASONING_EFFORT:minimal}

# 진행 판단 임계값 (진행-17: 운영 설정으로 조정). 기본 2/2/2는 DB 문서의 MVP 기본값.
progression:
  guidance:
    stalled-turns: ${GUIDANCE_STALLED_TURNS:2}
    low-information-turns: ${GUIDANCE_LOW_INFO_TURNS:2}
    remaining-turns: ${GUIDANCE_REMAINING_TURNS:2}

app:
  # 비밀번호 재설정 메일의 링크가 가리킬 프론트엔드 주소
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:7357}
  mail-from: ${SMTP_FROM}
  auth:
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:30m}

# Railway의 헬스체크가 /actuator/health를 호출한다. 인증 없이 응답하도록 노출한다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
