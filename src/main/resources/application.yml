spring:
  application:
    name: goodquestion-backend

  datasource:
    url: ${DB_URL}          # Supabase Postgres 연결 문자열
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # 스키마는 Flyway가 관리한다. 앱 기동 시 db/migration의 V*.sql을 순서대로 적용하고
  # 적용 이력을 flyway_schema_history에 남긴다 - 같은 마이그레이션이 두 번 돌지 않는다.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 이미 테이블이 있는데 이력 테이블이 없는 DB는 기동을 거부한다(기본값 false).
    # 반쯤 적용된 스키마를 만드는 대신 명시적으로 실패시키는 쪽이 안전하다.
    # 기존 DB에 도입할 때만 true로 켜고, 그 DB가 V1과 정확히 같은 상태인지 먼저 확인한다.
    baseline-on-migrate: false

  jpa:
    hibernate:
      # Flyway가 만든 스키마와 엔티티가 일치하는지만 검증한다(생성/변경하지 않음).
      # Boot는 Flyway를 EntityManagerFactory보다 먼저 실행하므로 순서가 보장된다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 100

jwt:
  secret: ${JWT_SECRET}                      # 자체 발급 Access 토큰 서명 키 (HS256, 32바이트 이상 권장)
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}   # 기본 7일 - Access 토큰 단일 전략(MVP), Refresh 없음

kakao:
  client-id: ${KAKAO_CLIENT_ID:}          # 카카오 REST API 키 - 인가 코드 교환에 필요
  client-secret: ${KAKAO_CLIENT_SECRET:}  # 카카오 콘솔에서 사용함으로 설정한 경우에만

external:
  stt:
    api-key: ${STT_API_KEY}
  tts:
    api-key: ${TTS_API_KEY}
  llm:
    api-key: ${LLM_API_KEY}
    analysis-model: ${ANALYSIS_MODEL:}
    character-model: ${CHARACTER_MODEL:}
