plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mugunghwa'
version = '0.0.1-SNAPSHOT'
description = 'goodquestion-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // DB 마이그레이션 - 스키마 변경을 버전으로 관리하고 앱 기동 시 자동 적용한다.
    // Boot 4는 자동설정이 기술별 모듈로 쪼개져 있어 spring-boot-flyway가 있어야
    // 기동 시 자동 실행된다. flyway-core만 넣으면 라이브러리만 있고 아무것도 돌지 않는다.
    // flyway-database-postgresql은 Flyway 10부터 DB별 지원이 분리돼 별도 의존성이 필요하다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    // 테스트용 PostgreSQL을 컨테이너로 직접 띄운다. 마이그레이션이 gen_random_uuid(), jsonb,
    // timestamptz 같은 PostgreSQL 전용 기능을 쓰므로 인메모리 DB로 대체할 수 없고,
    // ddl-auto=validate라 Flyway가 실제 스키마를 만들어야 컨텍스트가 뜬다.
    // Testcontainers 2.0부터 모듈 아티팩트에 testcontainers- 접두어가 붙는다(구 org.testcontainers:postgresql).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

/**
 * .env를 key=value 맵으로 읽는다. dotenv-java는 런타임 의존성이라 빌드 스크립트에서 못 쓴다.
 * 따옴표로 감싼 값과 주석/빈 줄만 처리하면 충분하다.
 */
def readDotenv = { File file ->
    def values = [:]
    file.eachLine('UTF-8') { line ->
        def trimmed = line.trim()
        if (trimmed.isEmpty() || trimmed.startsWith('#')) return
        def sep = trimmed.indexOf('=')
        if (sep <= 0) return
        def value = trimmed.substring(sep + 1).trim()
        if (value.length() >= 2 && (value.startsWith('"') && value.endsWith('"')
                || value.startsWith("'") && value.endsWith("'"))) {
            value = value.substring(1, value.length() - 1)
        }
        values[trimmed.substring(0, sep).trim()] = value
    }
    return values
}

tasks.named('test') {
    useJUnitPlatform()

    // 기본은 Testcontainers다. Docker를 쓰지 않고 이미 설치해 둔 PostgreSQL로 돌리려면
    // ./gradlew test -PlocalDb 로 실행한다. 접속 정보는 bootRun과 같은 .env에서 읽는다.
    //
    // 시스템 프로퍼티로 넘기는 이유는 우선순위 때문이다. 설정 파일보다 시스템 프로퍼티가
    // 우선하므로 application-test.yml의 자리 채우기 값을 확실히 덮는다.
    if (project.hasProperty('localDb')) {
        def envFile = rootProject.file('.env')
        if (!envFile.exists()) {
            throw new GradleException('-PlocalDb를 쓰려면 .env가 있어야 한다. .env.example을 복사해 값을 채운다.')
        }
        def env = readDotenv(envFile)
        if (!env['DB_URL']) {
            throw new GradleException('.env에 DB_URL이 없다. -PlocalDb는 접속할 DB를 스스로 준비해야 한다.')
        }
        systemProperty 'test.datasource.mode', 'local'
        systemProperty 'spring.datasource.url', env['DB_URL']
        systemProperty 'spring.datasource.username', env['DB_USERNAME'] ?: ''
        systemProperty 'spring.datasource.password', env['DB_PASSWORD'] ?: ''
        doFirst { logger.lifecycle("테스트가 로컬 DB를 사용한다: ${env['DB_URL']}") }
    }
}