plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mugunghwa'
version = '0.0.1-SNAPSHOT'
description = 'goodquestion-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // DB 마이그레이션 - 스키마 변경을 버전으로 관리하고 앱 기동 시 자동 적용한다.
    // Boot 4는 자동설정이 기술별 모듈로 쪼개져 있어 spring-boot-flyway가 있어야
    // 기동 시 자동 실행된다. flyway-core만 넣으면 라이브러리만 있고 아무것도 돌지 않는다.
    // flyway-database-postgresql은 Flyway 10부터 DB별 지원이 분리돼 별도 의존성이 필요하다.
    implementation 'org.springframework.boot:spring-boot-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    implementation 'io.github.cdimascio:dotenv-java:3.2.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    // 테스트용 PostgreSQL을 컨테이너로 직접 띄운다. 마이그레이션이 gen_random_uuid(), jsonb,
    // timestamptz 같은 PostgreSQL 전용 기능을 쓰므로 인메모리 DB로 대체할 수 없고,
    // ddl-auto=validate라 Flyway가 실제 스키마를 만들어야 컨텍스트가 뜬다.
    // Testcontainers 2.0부터 모듈 아티팩트에 testcontainers- 접두어가 붙는다(구 org.testcontainers:postgresql).
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}